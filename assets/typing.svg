<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" rx="20" fill="#0D1117"/>

  <text x="600" y="35" text-anchor="middle"
        fill="#A78BFA" font-family="Arial" font-size="14"
        letter-spacing="4">CURRENTLY WORKING ON</text>

  <g font-family="Arial" font-size="27" font-weight="600"
     text-anchor="middle" fill="#E9E9FF">

    <text x="600" y="90" opacity="0">Learning C++ &amp; Data Structures
      <animate attributeName="opacity" values="0;1;1;0;0"
        keyTimes="0;0.05;0.20;0.21;1" dur="8s"
        begin="0s" repeatCount="indefinite"/>
    </text>

    <text x="600" y="90" opacity="0">Practicing DSA Every Day
      <animate attributeName="opacity" values="0;1;1;0;0"
        keyTimes="0;0.05;0.20;0.21;1" dur="8s"
        begin="2s" repeatCount="indefinite"/>
    </text>

    <text x="600" y="90" opacity="0">Building Software Projects
      <animate attributeName="opacity" values="0;1;1;0;0"
        keyTimes="0;0.05;0.20;0.21;1" dur="8s"
        begin="4s" repeatCount="indefinite"/>
    </text>

    <text x="600" y="90" opacity="0">Exploring AI &amp; Machine Learning
      <animate attributeName="opacity" values="0;1;1;0;0"
        keyTimes="0;0.05;0.20;0.21;1" dur="8s"
        begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="280" y="115" width="640" height="2" rx="1" fill="#293044"/>
  <rect x="280" y="115" width="640" height="2" rx="1" fill="url(#accent)"/>
</svg>
