<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090B1A"/>
      <stop offset="55%" stop-color="#17112E"/>
      <stop offset="100%" stop-color="#071C2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8B9BB4" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>

  <circle cx="1000" cy="95" r="125" fill="#7C3AED" opacity=".22" filter="url(#glow)"/>
  <circle cx="1080" cy="290" r="115" fill="#06B6D4" opacity=".19" filter="url(#glow)"/>

  <g fill="none" stroke="url(#accent)" stroke-opacity=".55">
    <circle cx="1000" cy="180" r="115" stroke-width="1.5"/>
    <circle cx="1000" cy="180" r="82" stroke-width="1" stroke-dasharray="5 9"/>
    <ellipse cx="1000" cy="180" rx="155" ry="55" transform="rotate(-35 1000 180)" stroke-width="1.2"/>
  </g>

  <circle cx="1000" cy="65" r="5" fill="#22D3EE"/>
  <circle cx="1138" cy="205" r="5" fill="#A78BFA"/>

  <rect x="76" y="65" width="8" height="25" rx="4" fill="url(#accent)"/>
  <text x="101" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="16" letter-spacing="4" fill="#B9C5DA">PERSONAL DEVELOPER PROFILE</text>

  <text x="76" y="168" font-family="Segoe UI,Arial,sans-serif" font-size="64" font-weight="700" letter-spacing="1" fill="#FFFFFF">ANKIT GUPTA</text>

  <rect x="77" y="194" width="460" height="3" rx="2" fill="url(#accent)"/>

  <text x="77" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="21" fill="#D9D8F4">CSE-AIML STUDENT</text>
  <text x="77" y="273" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#AAB8CC">Software Development  •  AI &amp; Machine Learning</text>

  <g font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#C6D4E8">
    <text x="78" y="319">CODE</text>
    <circle cx="145" cy="314" r="3" fill="#22D3EE"/>
    <text x="160" y="319">LEARN</text>
    <circle cx="248" cy="314" r="3" fill="#A78BFA"/>
    <text x="263" y="319">BUILD</text>
  </g>

  <path d="M760 35H1125" stroke="url(#accent)" stroke-opacity=".55"/>
  <path d="M760 325H1125" stroke="url(#accent)" stroke-opacity=".55"/>
</svg>
